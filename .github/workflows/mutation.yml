name: mutation

# crucible runs its own Action against its own code, and publishes its own badge
# from the result. If the gate is worth asking of you, it survives here first --
# and the number on the README is the one CI actually measured, not one I typed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write        # to publish the badge payload to the badges branch
  pull-requests: write   # to comment the score on a PR

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Mutation score
        id: mutation
        uses: ./
        with:
          # no module: grade the 8-module [tool.mutmut] scope this repo already
          # maintains, rather than clobbering it. Dogfood means dogfood.
          fail-under: "95"
          badge-file: mutation.json

      - name: Publish the badge
        # main only: a PR must never be able to move the badge on the README
        if: github.ref == 'refs/heads/main'
        env:
          SCORE: ${{ steps.mutation.outputs.score }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # An orphan commit built with plumbing: the badge payload has no
          # business carrying the repo's history, and the working tree must not
          # be touched at all -- the runner re-reads action.yml from the
          # workspace at job teardown to run the local action's post step, so
          # the previous checkout-and-delete approach failed every main run
          # after the badge had already published.
          BLOB=$(git hash-object -w mutation.json)
          TREE=$(printf '100644 blob %s\tmutation.json\n' "$BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -m "mutation score: ${SCORE}%")
          git push -f origin "$COMMIT:refs/heads/badges"
