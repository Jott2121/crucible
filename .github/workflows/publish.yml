name: publish

# Trusted publishing (OIDC). PyPI verifies this exact repo + workflow filename +
# environment and mints a short-lived token for that one upload, so there is no
# API token stored in this repo, in a secret, or on anyone's laptop.
#
# One-time setup on PyPI (Publishing -> add a pending publisher):
#   PyPI project: crucible-harden   owner: Jott2121   repo: crucible
#   workflow: publish.yml           environment: pypi
#
# The distribution is `crucible-harden` (plain `crucible` was already taken on
# PyPI by an unrelated project); the console script it installs is `crucible`.
#
# Release procedure: bump `version` in pyproject.toml, merge, then publish a
# GitHub Release whose tag matches. PyPI refuses to overwrite an existing version,
# so a re-run of a shipped tag fails loudly instead of silently replacing a wheel.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/crucible-harden
    permissions:
      # The OIDC token PyPI checks. The only write scope this job gets.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # The suite is the release gate. A tag that cannot pass its own tests does
      # not get a wheel on PyPI, where the version number is unreusable forever.
      - name: Test before publishing
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      # Catches a README that will not render on PyPI *before* the upload, since
      # a bad description is permanent for that version.
      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
