name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # ruff ships in the dev extra, so no extra install and no new pinned action.
      # Rules are configured in pyproject.toml and are deliberately narrow.
      - run: ruff check src tests
      - run: python -m pytest -q -m "not slow" --cov --cov-report=term-missing --cov-fail-under=90
      - run: python -m pytest -q -m slow

  receipts:
    # Recompute published experiment figures from committed receipts and fail
    # if results JSON or the README / RESULTS write-ups drift. Stdlib only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python scripts/check_receipts.py

  no-employer-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Block employer / export-control markers and committed build junk
        run: |
          # Policy text that names the prohibited employer lives in AGENTS.md and
          # .cursor/ (and the pattern itself lives in this workflow). Those paths
          # are excluded. PROPRIETARY is case-sensitive so the English adjective
          # "proprietary" in docs/RELATED-WORK.md is not a hit.
          # Author bylines — paper draft affiliation lines and the pyproject
          # authors field — are dropped so the existing bio cannot false-positive.
          pattern='lockheed|\blmco\b|\bCUI\b|\bITAR\b|EXPORT CONTROLLED'
          hits="$(git grep -nIiE "$pattern" -- . ':!.cursor' ':!AGENTS.md' ':!.github' || true)"
          props="$(git grep -nE '\bPROPRIETARY\b' -- . ':!.cursor' ':!AGENTS.md' ':!.github' || true)"
          filtered="$(printf '%s\n%s\n' "$hits" "$props" | sed '/^$/d' | grep -v -E '^(paper/DRAFT-[^:]+\.md:[0-9]+:\*\*Jeff Otterson\*\*|pyproject\.toml:[0-9]+:authors = )' || true)"
          if [ -n "$filtered" ]; then
            printf '%s\n' "$filtered"
            exit 1
          fi
          ! git ls-files | grep -E '(__pycache__/|\.pyc$|^\.coverage$)'
