name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # ruff ships in the dev extra, so no extra install and no new pinned action.
      # Rules are configured in pyproject.toml and are deliberately narrow.
      - run: ruff check src tests
      - run: python -m pytest -q -m "not slow" --cov --cov-report=term-missing --cov-fail-under=90
      - run: python -m pytest -q -m slow

  receipts:
    # Recompute published experiment figures from committed receipts and fail
    # if results JSON or the README / RESULTS write-ups drift. Stdlib only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python scripts/check_receipts.py

  no-employer-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Scans every tracked file, AGENTS.md, .cursor/ and .github/ included. The
      # base is the committed hash list (.github/blocked-terms.sha256); a missing
      # or empty hash file fails the job, so it never passes just because the
      # optional EMPLOYER_MARKERS secret (an extra regex alternation) is unset.
      - name: Block employer terms and export-control markers
        env:
          EMPLOYER_MARKERS: ${{ secrets.EMPLOYER_MARKERS }}
        run: python3 scripts/scan_blocked_terms.py
      - name: Block committed build junk
        run: |
          ! git ls-files | grep -E '(__pycache__/|\.pyc$|^\.coverage$)'
